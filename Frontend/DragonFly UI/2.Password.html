<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        position: relative;
    }
    .flex{
        display: flex;
        align-items: center;
        justify-content: center;
    }
    body{
        width: 100vw;
        height: 100vh;
        background: #000000;
        color: #636B53;
        font-family: sans-serif;
        text-align: center;
    }
    .numPan{
        width: 480px;
        height: 800px;
        border-radius: 10px;
        background: #fff;
    }
    .numPan .disp{
        font-size: 2em;
    }
    .numPan .disp h2{
        padding: 20px;
    }
    .numPan .disp input{
        width: 480px;
        padding: 20px;
        outline: none;
        border: none;
        background: none;
        text-align: center;
        color: #636B53;
        font-size: 1em;
    }
    .numPan .nums > .r div{
        width: 125px;
        height: 125px;
        margin: 5px;
        border: 1px solid #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 0.5rem;
        background: #636B53;
        font-size: 2em;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 0 10px #ffffff;
    }
    .numPan .nums > .r div.active-key{
        background: #8b9675; 
        transform: scale(0.90);
        transition: 0.1s, transform 0.1s;
    }

    .numPan .badge h2{
        text-align: center;
        padding: 20px;
        font-size: 2em;
    }
    
</style>
</head>

<body class="flex">
    <div class="numPan">
        <div class="disp">
            <h2>Enter code</h2>
            <input type="password">
        </div>
        <div class="nums">
            <div class="flex r r1">
                <div><span>1</span></div>
                <div><span>2</span></div>
                <div><span>3</span></div>
            </div>
            <div class="flex r r2">
                <div><span>4</span></div>
                <div><span>5</span></div>
                <div><span>6</span></div>
            </div>
            <div class="flex r r3">
                <div><span>7</span></div>
                <div><span>8</span></div>
                <div><span>9</span></div>
            </div>
            <div class="flex r r4">
                <div><span>0</span></div>
            </div>

        </div>
        <div class="badge">
            <h2>or Badge <img src="wifi.png"> </h2>
        </div>
    </div>

    <script> 
        const CORRECT_CODE = "0101";
        const MAX_LENGTH = 4;
        const ERROR_DISPLAY = "----";

        const btn = document.querySelectorAll(".r > div");
        const inp = document.querySelector("input");       
    
        function resetInput(isError = false) {
            inp.value = "";
            if (isError) {
                inp.placeholder = ERROR_DISPLAY;
                setTimeout(() => {
                inp.placeholder = "";
            }, 500); 
            }
        }

        btn.forEach(buttonElement => {
            buttonElement.addEventListener("click", () => {

                const key = buttonElement.innerText.trim();
                let currentCode = inp.value;

                buttonElement.classList.add('active-key');
                setTimeout(() => {
                    buttonElement.classList.remove('active-key');
                }, 100);

                if (currentCode.length >= MAX_LENGTH) {
                    return; 
                }
            
                currentCode += key;
                inp.value = currentCode;

                if (currentCode.length === MAX_LENGTH) {

                    if (currentCode === CORRECT_CODE) {
                        console.log("Access Granted!");
                        window.location.href = "3.Welcome.html";
                    } else {
                        console.log("Incorrect Code. Entered:", currentCode);
                        resetInput(true); 
                    }
                }
            });
        });
    </script>

</body>
</html>
