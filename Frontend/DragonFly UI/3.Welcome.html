<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .page {
            width: 480px;
            height: 800px;
            background: #fff;
            display: flex;
            justify-content: center;   
            align-items: center;       
        }

        .t1-container {
            width: 100px;
            height: 471px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
        }

        .t1-text {
            font-size: 128pt;
            font-weight: bold;
            color: #636B53;
            animation: slideLeft 1.3s ease-out forwards;
        }

        .t2-text {
            font-size: 64pt;
            font-weight: bold;
            color: #636B53;
            animation: slideLeft 1.3s ease-out forwards;      
        }

        @keyframes slideLeft {
        0% { transform: translateX(-70%); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
        }

    </style>
</head>

<body>
    <div class="page">

        <div class="t1-container">
            <div class="t1-text">Hi</div>
            <div class="t2-text">Dave</div>
        </div>
</body>

<script>
    setTimeout(() => {
        window.location.href = "4.VehiculeSelection.html";
    }, 3000);
</script>


</html>
